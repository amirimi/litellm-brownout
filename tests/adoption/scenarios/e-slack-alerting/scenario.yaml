description: >
  Slack alerting is on with LiteLLM's default alert types, which include budget alerts, and stays
  on after adoption. There is no Redis, and models are priced in config.yaml.
seed:
  teams:
    - alias: search
      max_budget: 1.0
      budget_duration: 7d
      models: [chat, chat-cheap]
  keys:
    - alias: search-app
      team: search
environment:
  SLACK_WEBHOOK_URL: http://127.0.0.1:9/slack
confirm:
  key: search-app
  model: chat
fallback:
  team: "{team:search}"
  route: chat
  fallback: chat-cheap
  degrade_at: 75
drive:
  key: search-app
  model: chat
expected_gaps: []
