description: >
  Redis already coordinates LiteLLM's replicas through router_settings, the setup LiteLLM documents
  for load balancing across instances. init does not derive coordination_redis from it.
seed:
  teams:
    - alias: search
      max_budget: 1.0
      budget_duration: 7d
      models: [chat, chat-cheap]
  keys:
    - alias: search-app
      team: search
choices:
  - rule: redis-configured
    subject: general_settings.coordination_redis
    values:
      "<YOUR REDIS HOST>": redis
confirm:
  key: search-app
  model: chat
fallback:
  team: "{team:search}"
  route: chat
  fallback: chat-cheap
  degrade_at: 75
  data_class: internal
drive:
  key: search-app
  model: chat
expected_gaps: []
