description: >
  Models split into models.yaml through LiteLLM's include key and priced there. Teams and keys
  come from the API, and there is no Redis.
seed:
  teams:
    - alias: search
      max_budget: 1.0
      budget_duration: 7d
      models: [chat, chat-cheap]
  keys:
    - alias: search-app
      team: search
provisions:
  "<YOUR REDIS HOST>":
    readme: redis-service
    value: redis
confirm:
  key: search-app
  model: chat
fallback:
  team: "{team:search}"
  route: chat
  fallback: chat-cheap
  degrade_at: 75
  data_class: internal
drive:
  key: search-app
  model: chat
expected_gaps: []
