description: >
  One team has no budget, no window and an empty model list, which LiteLLM reads as every model.
  Another has a two-day window, which does not tumble with LiteLLM's resets. There is no Redis.
seed:
  teams:
    - alias: search
      models: []
    - alias: ops
      max_budget: 5.0
      budget_duration: 2d
      models: [chat]
  keys:
    - alias: search-app
      team: search
    - alias: ops-app
      team: ops
choices:
  - rule: team-in-manifest
    subject: "{team:search}"
    values:
      "<YOUR BUDGET>": "1.0"
      "<YOUR DURATION, SUCH AS 7d>": 7d
  - rule: duration-tumbles
    subject: "{team:ops}"
    values:
      "<YOUR DURATION, SUCH AS 7d>": 1d
confirm:
  key: search-app
  model: chat
fallback:
  team: "{team:search}"
  route: chat
  fallback: chat-cheap
  degrade_at: 75
drive:
  key: search-app
  model: chat
expected_gaps: []
