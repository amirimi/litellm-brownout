description: >
  The same setup as d-redis-cache, with prices written in scientific notation without a decimal
  point, such as 1e-4. PyYAML reads those as strings, and LiteLLM converts them to numbers.
seed:
  teams:
    - alias: search
      max_budget: 1.0
      budget_duration: 7d
      models: [chat, chat-cheap]
  keys:
    - alias: search-app
      team: search
confirm:
  key: search-app
  model: chat
fallback:
  team: search
  route: chat
  fallback: chat-cheap
  degrade_at: 75
  data_class: internal
drive:
  key: search-app
  model: chat
expected_gaps: []
