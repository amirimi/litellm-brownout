description: >
  A wildcard model group routes every openai/* model through one priced deployment, and the team
  may call the wildcard and the cheap group. There is no Redis. Brownout refuses a request for a
  name the wildcard serves, so the path stops at the confirm request with its printed reason.
seed:
  teams:
    - alias: search
      max_budget: 1.0
      budget_duration: 7d
      models: ["openai/*", chat-cheap]
  keys:
    - alias: search-app
      team: search
confirm:
  key: search-app
  model: openai/gpt-4o
fallback:
  team: "{team:search}"
  route: "openai/*"
  fallback: chat-cheap
  degrade_at: 75
drive:
  key: search-app
  model: openai/gpt-4o
expected_gaps:
  - confirm:model_not_a_group
