description: >
  The gateway already falls back from chat to chat-cheap through router_settings, which brownout
  empties on governed requests. There is no Redis.
seed:
  teams:
    - alias: search
      max_budget: 1.0
      budget_duration: 7d
      models: [chat, chat-cheap]
  keys:
    - alias: search-app
      team: search
provisions:
  "<YOUR REDIS HOST>":
    readme: redis-service
    value: redis
confirm:
  key: search-app
  model: chat
fallback:
  team: "{team:search}"
  route: chat
  fallback: chat-cheap
  degrade_at: 75
drive:
  key: search-app
  model: chat
expected_gaps: []
