description: >
  Every caller uses the master key. There are no teams and no virtual keys, which is how many small
  gateways start. There is no Redis, and models are priced in config.yaml.
seed: {}
choices:
  - rule: team-in-manifest
    subject: manifest
    values:
      "<YOUR TEAM ID>": search
      "<YOUR BUDGET>": "1.0"
      "<YOUR DURATION, SUCH AS 7d>": 7d
confirm:
  key: printed-key
  model: chat
fallback:
  team: search
  route: chat
  fallback: chat-cheap
  degrade_at: 75
drive:
  key: printed-key
  model: chat
expected_gaps: []
