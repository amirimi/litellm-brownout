[build-system]
requires = ["uv_build >= 0.12.5, <0.13.0"]
build-backend = "uv_build"

[project]
name = "litellm-brownout"
version = "1.0.0"
description = "Tiered team budget enforcement and graceful downgrade for a LiteLLM gateway"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amir Karimi" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "litellm[proxy]==1.95.1",
    "pyyaml>=6.0",
]

[project.scripts]
brownout = "brownout.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "ruff>=0.16",
    "mypy>=1.14",
]

[tool.uv.build-backend]
module-name = "brownout"
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: drives the composed gateway over HTTP and is skipped without it",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "BLE", "SIM"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.12"
files = ["src/brownout"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
