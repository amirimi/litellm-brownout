name: litellm matrix

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: litellm-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-line:
    name: LiteLLM ${{ matrix.litellm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        litellm:
          - "1.95.1"
          - "1.96.2"
          - "1.97.0"
          - "1.98.1"
          - "1.99.4"
          - "1.100.5"
          - "1.101.6"
          - "1.102.4"
          - "1.103.4"
          - "1.104.2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv pip install --no-config "litellm[proxy]==${{ matrix.litellm }}"
      - run: uv run --no-sync pytest -m "not e2e"
      - run: cp .env.example .env
      - run: docker compose up -d --wait
        env:
          LITELLM_TAG: v${{ matrix.litellm }}
      - name: run the sequence
        run: set -a && . ./.env && set +a && uv run --no-sync pytest -m e2e
        env:
          LAB_REQUIRE_STACK: "1"
          LITELLM_TAG: v${{ matrix.litellm }}
      - if: always()
        run: docker compose logs litellm
        env:
          LITELLM_TAG: v${{ matrix.litellm }}
      - if: always()
        run: docker compose down -v
        env:
          LITELLM_TAG: v${{ matrix.litellm }}
