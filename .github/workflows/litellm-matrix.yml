name: litellm matrix

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: litellm-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-line:
    name: LiteLLM ${{ matrix.litellm }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        litellm:
          - "1.101.6"
          - "1.102.4"
          - "1.103.4"
          - "1.104.3"
          - "1.105.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.20"
          enable-cache: true
      - run: uv sync --locked
      - run: uv pip install --no-config "litellm[proxy]==${{ matrix.litellm }}"
      - run: uv run --no-sync pytest -m "not e2e"
      - run: cp .env.example .env
      - run: docker compose up -d --wait
        env:
          LITELLM_TAG: v${{ matrix.litellm }}
      - name: run the sequence
        run: set -a && . ./.env && set +a && uv run --no-sync pytest -m e2e
        env:
          LAB_REQUIRE_STACK: "1"
          LITELLM_TAG: v${{ matrix.litellm }}
      - if: always()
        run: docker compose logs litellm
        env:
          LITELLM_TAG: v${{ matrix.litellm }}
      - if: always()
        run: docker compose down -v
        env:
          LITELLM_TAG: v${{ matrix.litellm }}
