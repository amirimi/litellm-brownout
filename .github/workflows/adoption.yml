name: adoption

on:
  pull_request:
    paths:
      - "src/brownout/cli.py"
      - "src/brownout/inputs.py"
      - "src/brownout/onboarding.py"
      - "src/brownout/onboarding_files.py"
      - "src/brownout/gateway_api.py"
      - "src/brownout/rules.py"
      - "README.md"
      - "docs/**"
      - "tests/adoption/**"
      - "tests/test_adoption.py"
      - ".github/workflows/adoption.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: adoption-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenario:
    name: ${{ matrix.scenario }} on ${{ matrix.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        release: ["v1.101.6", "v1.104.2"]
        scenario:
          - a-config-models
          - a2-no-model-store
          - b-ui-models
          - c-include
          - d-redis-cache
          - d2-router-redis
          - e-slack-alerting
          - f-master-key-only
          - g-member-budgets
          - h-team-gaps
          - i-wildcard
          - j-router-fallbacks
          - k-existing-manifest
          - n-flush-lists
          - o-scientific-prices
        include:
          - scenario: a-config-models
            release: "v1.102.4"
          - scenario: a-config-models
            release: "v1.103.4"
          - scenario: b-ui-models
            release: "v1.102.4"
          - scenario: b-ui-models
            release: "v1.103.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.20"
          enable-cache: true
      - run: uv sync --locked
      - name: adopt brownout on a stock gateway
        run: uv run pytest -m adoption tests/test_adoption.py -rf
        env:
          BROWNOUT_ADOPTION: "1"
          BROWNOUT_ADOPTION_RELEASES: ${{ matrix.release }}
          BROWNOUT_ADOPTION_SCENARIOS: ${{ matrix.scenario }}
